name: Publish to PyPI

# Triggered automatically when release-please publishes a GitHub Release
# (after its release PR is merged into `main`). The job uses PyPI Trusted
# Publishing (OIDC) — no API tokens are stored in the repo.
#
# Prerequisites (one-time setup):
#   1. PyPI → Publishing → add a pending publisher with:
#        Project name : domainraptor
#        Owner        : ErnestoCubo
#        Repository   : DomainRaptor
#        Workflow     : publish.yml
#        Environment  : pypi
#   2. GitHub → Settings → Environments → create an environment named `pypi`
#      (optionally add required reviewers for manual approval).

on:
  release:
    types: [published]
  workflow_dispatch:  # allow a manual re-run from the Actions tab

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/domainraptor
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
