[project]
name = "domainraptor-api"
version = "0.1.0"
description = "DomainRaptor HTTP API (FastAPI control plane)."
requires-python = ">=3.10"
dependencies = ["domainraptor", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.uv.sources]
domainraptor = { workspace = true }
